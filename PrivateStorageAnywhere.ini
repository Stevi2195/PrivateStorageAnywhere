[Settings]
; Private Storage Anywhere
; Opens your Private Storage from anywhere with a hotkey or controller button.

; Enable/disable the mod (1=on, 0=off)
Enabled=1

; Enable logging to .log file (1=on, 0=off)
DebugLog=0

; Keyboard hotkey in hex (default: 75 = F6, set to 00 to disable keyboard)
Hotkey=75

; Keyboard modifier (hold this key + Hotkey to trigger, 00 = no modifier)
; Example: ModifierKey=10 (Shift) + Hotkey=49 (I) = Shift+I to open storage
ModifierKey=00

; Press this key to reload the INI without restarting the game.
; Example: 7A = F11. Set to 00 to disable.
ReloadKey=7A

; Controller button to open Private Storage (0000 = disabled)
ControllerButton=0000

; Hold this button before pressing ControllerButton (0000 = no modifier)
; Recommended: use a modifier to avoid conflicts with in-game controls
ControllerModifier=0000

; PS5 DualSense / PS4 DualShock 4 button to close Private Storage (native HID, no Steam Input needed)
; Values: Share, Options, Circle, Triangle, Square, Cross, L1, R1, L3, R3, Touchpad, PS, Mute, none
PSButton=Share

; ============================================================
;  Multi-Panel — 6 panels
;  Private Storage + 5 Housing Chests, each with its own keyboard,
;  XInput, and PS5/PS4 (HID) bindings:
;     <Name>Hotkey              (VK code, 0 = disabled)
;     <Name>Modifier            (VK code, 0 = no modifier)
;     <Name>ControllerButton    (XInput button mask, 0 = disabled)
;     <Name>ControllerModifier  (XInput hold-this-first, 0 = no modifier)
;     <Name>PSButton            (PS5/PS4 button name, "" = disabled)
;
;  Each binding is a panel toggle: opens that panel from cold, or closes
;  the warehouse if any panel is open. To switch chests, close one and
;  press the next chest's binding.
;
;  Advanced: override a panel's SetInventory filter by adding
;  <Name>InitString=Character,Focus,True;Housing_X,Focus,True to this
;  file. Useful only if a future game update renames a namespace.
; ============================================================

; --- Panel 0: Private Storage (CampWareHouse) ---
; The legacy Hotkey + ControllerButton + PSButton above already open
; Private. Set values here only for an ADDITIONAL key/button.
PrivateHotkey=00
PrivateModifier=00
PrivateControllerButton=0000
PrivateControllerModifier=0000
PrivatePSButton=

; --- Panel 1: Gatherables Chest ---  default F7
GatherablesHotkey=76
GatherablesModifier=00
GatherablesControllerButton=0000
GatherablesControllerModifier=0000
GatherablesPSButton=

; --- Panel 2: Dresser ---  default F8
DresserHotkey=77
DresserModifier=00
DresserControllerButton=0000
DresserControllerModifier=0000
DresserPSButton=

; --- Panel 3: Refrigerator ---  default F9
RefrigeratorHotkey=78
RefrigeratorModifier=00
RefrigeratorControllerButton=0000
RefrigeratorControllerModifier=0000
RefrigeratorPSButton=

; --- Panel 4: Symbol Storage ---  disabled by default
; "Symbol" is one of the housing namespace names found in the game data,
; but its in-game purpose / visibility is currently unclear. Leave at 00
; or set a hotkey if you want to experiment.
SymbolHotkey=00
SymbolModifier=00
SymbolControllerButton=0000
SymbolControllerModifier=0000
SymbolPSButton=

; --- Panel 5: Collecting Storage ---  default Num0
CollectingHotkey=60
CollectingModifier=00
CollectingControllerButton=0000
CollectingControllerModifier=0000
CollectingPSButton=

; ============================================================
;  Diagnostics / advanced
; ============================================================

; Memory-diff snapshot hotkey (default 79 = F10). Used to identify container-bind
; writes the game performs when opening a Housing-Chest at an NPC. Set to 00 to disable.
DiffSnapshotKey=79
DiffSnapshotModifier=00

; PanelValue fallback (handler+0x110). Per-panel type-IDs are resolved at
; runtime via the game's hash-map. These fallbacks are only used if the
; runtime lookup fails (rare).
PrivatePanelValue=0000
GatherablesPanelValue=02D1

; ============================================================
;  Keyboard Key Reference
;  Use these hex values for the Hotkey field.
; ============================================================
;
;  Letters:    A=41 B=42 C=43 D=44 E=45 F=46 G=47 H=48
;              I=49 J=4A K=4B L=4C M=4D N=4E O=4F P=50
;              Q=51 R=52 S=53 T=54 U=55 V=56 W=57 X=58
;              Y=59 Z=5A
;
;  Numbers:    0=30 1=31 2=32 3=33 4=34 5=35 6=36 7=37 8=38 9=39
;
;  F-Keys:     F1=70  F2=71  F3=72  F4=73  F5=74  F6=75
;              F7=76  F8=77  F9=78  F10=79 F11=7A F12=7B
;              F13=7C F14=7D F15=7E F16=7F F17=80 F18=81
;              F19=82 F20=83 F21=84 F22=85 F23=86 F24=87
;
;  Numpad:     Num0=60 Num1=61 Num2=62 Num3=63 Num4=64
;              Num5=65 Num6=66 Num7=67 Num8=68 Num9=69
;              Multiply=6A  Add=6B  Subtract=6D  Decimal=6E  Divide=6F
;
;  Navigation: Insert=2D  Delete=2E  Home=24  End=23
;              PageUp=21  PageDown=22
;              Left=25  Up=26  Right=27  Down=28
;
;  Modifiers:  Shift=10  Ctrl=11  Alt=12
;              LShift=A0  RShift=A1  LCtrl=A2  RCtrl=A3
;              LAlt=A4  RAlt=A5
;
;  Special:    Tab=09  Esc=1B  Space=20  Enter=0D  Backspace=08
;              CapsLock=14  NumLock=90  ScrollLock=91
;              PrintScreen=2C  Pause=13
;
;  Punctuation: ;=BA  ==BB  ,=BC  -=BD  .=BE  /=BF  `=C0
;               [=DB  \=DC  ]=DD  '=DE
;
;  Mouse:      Side1=05  Side2=06
;
;  Media:      VolumeMute=AD  VolumeDown=AE  VolumeUp=AF
;              NextTrack=B0  PrevTrack=B1  Stop=B2  PlayPause=B3

; ============================================================
;  Controller Button Reference (XInput)
;  Use these hex values for ControllerButton and ControllerModifier.
; ============================================================
;
;  D-Pad:      Up=0001  Down=0002  Left=0004  Right=0008
;  Menu:       Start/Menu=0010     Back/View=0020
;  Sticks:     LeftStick=0040      RightStick=0080
;  Bumpers:    LB=0100             RB=0200
;  Face:       A=1000  B=2000      X=4000    Y=8000
;
;  Non-Xbox controllers (Switch, etc.) work
;  automatically through Steam Input, which is enabled by default.
;
; ============================================================
;  PS5 / PS4 Controller Button Reference (HID)
;  Use these names for PSButton (case-insensitive).
; ============================================================
;
;  Face:       Circle  Triangle  Square  Cross
;  Bumpers:    L1  R1
;  Sticks:     L3  R3
;  Menu:       Share  Options
;  Special:    Touchpad  PS  Mute (Mute = DualSense only)
;  Disable:    none
