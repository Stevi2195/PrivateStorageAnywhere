; ============================================================
;  Private Storage Anywhere
;  Opens Private Storage and 5 Housing Chests from anywhere
;  via keyboard hotkey, XInput button, or PS5/PS4 button.
;
;  Hex values for keys/buttons are listed at the bottom of
;  this file (Keyboard / XInput / PS5-PS4 reference).
; ============================================================

[Settings]

; ============================================================
;  General
; ============================================================

; Enable/disable the mod (1=on, 0=off)
Enabled=1

; Write a .log file next to the DLL (1=on, 0=off)
DebugLog=1

; Verbose RE/trace hooks on the natural NPC-open pipeline (1=on, 0=off).
; Very noisy and only useful for reverse-engineering. Leave at 0.
TraceMode=0

; Reload this INI without restarting the game.
; Default: 7A = F11. Set to 00 to disable.
ReloadKey=7A

; ============================================================
;  Panel Bindings — 6 panels
;
;  Each binding toggles a panel: opens it from cold, or closes
;  the warehouse if any panel is currently open. To switch
;  chests, close one and press the next chest's binding.
;
;  Fields per panel:
;    <Name>Hotkey              VK code,        00   = disabled
;    <Name>Modifier            VK code,        00   = no modifier
;    <Name>ControllerButton    XInput mask,    0000 = disabled
;    <Name>ControllerModifier  XInput hold,    0000 = no modifier
;    <Name>PSButton            PS button name, ""   = disabled
;    <Name>PSModifier          PS button name, ""   = no modifier
;
;  Example: GatherablesPSModifier=L1 + GatherablesPSButton=Triangle
;           → Hold L1 and press Triangle to open Gatherables.
;
;  Advanced: override a panel's SetInventory filter by adding
;  <Name>InitString=Character,Focus,True;Housing_X,Focus,True
;  to this file. Useful only if a future game update renames
;  a namespace.
; ============================================================

; ------------------------------------------------------------
;  Panel 0 — Private Storage (CampWareHouse)
;  Default keyboard:   F4
;  Default XInput:     hold LB + press LeftStick
;  Default PS5/PS4:    hold L1 + press L3
; ------------------------------------------------------------
PrivateHotkey=73
PrivateModifier=00
PrivateControllerButton=0040
PrivateControllerModifier=0100
PrivatePSButton=L3
PrivatePSModifier=L1

; ------------------------------------------------------------
;  Panel 1 — Gatherables Chest
;  Default keyboard:   F5
;  Default XInput:     hold LB + press RightStick
;  Default PS5/PS4:    hold L1 + press R3
; ------------------------------------------------------------
GatherablesHotkey=74
GatherablesModifier=00
GatherablesControllerButton=0080
GatherablesControllerModifier=0100
GatherablesPSButton=R3
GatherablesPSModifier=L1

; ------------------------------------------------------------
;  Panel 2 — Dresser
;  Default keyboard:   F6
; ------------------------------------------------------------
DresserHotkey=75
DresserModifier=00
DresserControllerButton=0000
DresserControllerModifier=0000
DresserPSButton=
DresserPSModifier=

; ------------------------------------------------------------
;  Panel 3 — Refrigerator
;  Default keyboard:   F7
; ------------------------------------------------------------
RefrigeratorHotkey=76
RefrigeratorModifier=00
RefrigeratorControllerButton=0000
RefrigeratorControllerModifier=0000
RefrigeratorPSButton=
RefrigeratorPSModifier=

; ------------------------------------------------------------
;  Panel 4 — Symbol Storage
;  Default keyboard:   F8
;  "Symbol" is one of the housing namespace names found in the
;  game data, but its in-game purpose / visibility is currently
;  unclear. Set Hotkey=00 to disable if you don't want it bound.
; ------------------------------------------------------------
SymbolHotkey=77
SymbolModifier=00
SymbolControllerButton=0000
SymbolControllerModifier=0000
SymbolPSButton=
SymbolPSModifier=

; ------------------------------------------------------------
;  Panel 5 — Collecting Storage
;  Default keyboard:   F9
; ------------------------------------------------------------
CollectingHotkey=78
CollectingModifier=00
CollectingControllerButton=0000
CollectingControllerModifier=0000
CollectingPSButton=
CollectingPSModifier=

; ============================================================
;  Keyboard Key Reference
;  Use these hex values for the Hotkey / Modifier fields.
; ============================================================
;
;  Letters:    A=41 B=42 C=43 D=44 E=45 F=46 G=47 H=48
;              I=49 J=4A K=4B L=4C M=4D N=4E O=4F P=50
;              Q=51 R=52 S=53 T=54 U=55 V=56 W=57 X=58
;              Y=59 Z=5A
;
;  Numbers:    0=30 1=31 2=32 3=33 4=34 5=35 6=36 7=37 8=38 9=39
;
;  F-Keys:     F1=70  F2=71  F3=72  F4=73  F5=74  F6=75
;              F7=76  F8=77  F9=78  F10=79 F11=7A F12=7B
;              F13=7C F14=7D F15=7E F16=7F F17=80 F18=81
;              F19=82 F20=83 F21=84 F22=85 F23=86 F24=87
;
;  Numpad:     Num0=60 Num1=61 Num2=62 Num3=63 Num4=64
;              Num5=65 Num6=66 Num7=67 Num8=68 Num9=69
;              Multiply=6A  Add=6B  Subtract=6D  Decimal=6E  Divide=6F
;
;  Navigation: Insert=2D  Delete=2E  Home=24  End=23
;              PageUp=21  PageDown=22
;              Left=25  Up=26  Right=27  Down=28
;
;  Modifiers:  Shift=10  Ctrl=11  Alt=12
;              LShift=A0  RShift=A1  LCtrl=A2  RCtrl=A3
;              LAlt=A4  RAlt=A5
;
;  Special:    Tab=09  Esc=1B  Space=20  Enter=0D  Backspace=08
;              CapsLock=14  NumLock=90  ScrollLock=91
;              PrintScreen=2C  Pause=13
;
;  Punctuation: ;=BA  ==BB  ,=BC  -=BD  .=BE  /=BF  `=C0
;               [=DB  \=DC  ]=DD  '=DE
;
;  Mouse:      Side1=05  Side2=06
;
;  Media:      VolumeMute=AD  VolumeDown=AE  VolumeUp=AF
;              NextTrack=B0  PrevTrack=B1  Stop=B2  PlayPause=B3

; ============================================================
;  Controller Button Reference (XInput)
;  Use these hex values for ControllerButton / ControllerModifier.
; ============================================================
;
;  D-Pad:      Up=0001  Down=0002  Left=0004  Right=0008
;  Menu:       Start/Menu=0010     Back/View=0020
;  Sticks:     LeftStick=0040      RightStick=0080
;  Bumpers:    LB=0100             RB=0200
;  Face:       A=1000  B=2000      X=4000    Y=8000
;
;  Non-Xbox controllers (Switch, etc.) work automatically
;  through Steam Input, which is enabled by default.

; ============================================================
;  PS5 / PS4 Controller Button Reference (HID)
;  Use these names for PSButton / PSModifier (case-insensitive).
; ============================================================
;
;  Face:       Circle  Triangle  Square  Cross
;  Bumpers:    L1  R1
;  Sticks:     L3  R3
;  Menu:       Share  Options
;  Special:    Touchpad  PS  Mute (Mute = DualSense only)
;  Disable:    none
